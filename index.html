<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Build Khắc Chế LMHT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: cột chọn bên trái, bên phải là thẻ đối đầu, đường lên đồ dạng lưới thẻ, rồi giày, ngọc, cách chơi */
:root {
  --bg: #edf1f5;
  --surface: #ffffff;
  --surface-2: #e5ecf2;
  --fg: #0f1b26;
  --muted: #52657a;
  --line: #cfdae4;
  --accent: #0a6b7d;
  --accent-fg: #ffffff;
  --gold: #a87612;
  --gold-fg: #ffffff;
  --ad: #b83f0c;
  --ap: #5a44c4;
  --df: #2c7a4d;
  --ut: #8f6300;
  --buff: #1f7a3f;
  --nerf: #b3261e;
  --glow: rgba(10, 107, 125, .14);
  --f-label: "Barlow Condensed", "Arial Narrow", sans-serif;
  --f-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #08121b; --surface: #0f1e2b; --surface-2: #172b3b; --fg: #e7eef4; --muted: #8fa4b6;
    --line: #223647; --accent: #3cc3d5; --accent-fg: #04202a; --gold: #e0b659; --gold-fg: #2a1d00;
    --ad: #ff9a62; --ap: #aa9cff; --df: #6fd19a; --ut: #e2b84b; --buff: #62d58d; --nerf: #ff8f87;
    --glow: rgba(60, 195, 213, .16);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #08121b; --surface: #0f1e2b; --surface-2: #172b3b; --fg: #e7eef4; --muted: #8fa4b6;
  --line: #223647; --accent: #3cc3d5; --accent-fg: #04202a; --gold: #e0b659; --gold-fg: #2a1d00;
  --ad: #ff9a62; --ap: #aa9cff; --df: #6fd19a; --ut: #e2b84b; --buff: #62d58d; --nerf: #ff8f87;
  --glow: rgba(60, 195, 213, .16);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image: radial-gradient(900px 420px at 12% -8%, var(--glow), transparent), radial-gradient(700px 360px at 100% 0%, color-mix(in srgb, var(--gold) 10%, transparent), transparent);
  background-repeat: no-repeat;
  color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.6; font-synthesis: none;
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
h1, h2, h3, h4 { font-family: var(--f-body); margin: 0; text-wrap: balance; }
h1 { font-size: clamp(30px, 4.4vw, 46px); line-height: 1.08; font-weight: 800; letter-spacing: -.02em; }
h2 { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
h3 { font-family: var(--f-label); font-size: 15px; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); font-weight: 600; }
.eyebrow { font-family: var(--f-label); font-size: 15px; letter-spacing: .22em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin: 0 0 6px; }
.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 14px 24px; }
.lead { margin: 8px 0 0; color: var(--muted); max-width: 60ch; font-size: 15px; }
.patch { display: flex; align-items: center; gap: 10px; font-family: var(--f-label); font-size: 15px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 999px; white-space: nowrap; }
.patch b { color: var(--accent); font-size: 18px; }
.patch i { width: 7px; height: 7px; border-radius: 50%; background: var(--buff); display: inline-block; }
.layout { display: grid; grid-template-columns: minmax(0, 400px) minmax(0, 1fr); gap: 22px; align-items: start; }
@media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.panel { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 16px; min-width: 0; overflow: hidden; }
.panel::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: linear-gradient(90deg, var(--accent), var(--gold)); }
.sec { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.favs { display: flex; flex-wrap: wrap; gap: 6px; }
.fav-label { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
.fav { font: inherit; font-size: 13px; padding: 5px 12px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); border-radius: 999px; cursor: pointer; }
.fav.mine { border-color: var(--accent); font-weight: 600; }
.fav[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.fav small { opacity: .72; font-size: 11px; margin-left: 2px; }
.lanes { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 8px; }
.lane { font-family: var(--f-body); font-size: 13px; font-weight: 600; padding: 8px 2px; border: 0; background: transparent; color: var(--muted); border-radius: 6px; cursor: pointer; }
.lane[aria-pressed="true"] { background: var(--surface); color: var(--accent); box-shadow: 0 1px 0 var(--line), inset 0 -2px 0 var(--accent); }
.lane:focus-visible, .champ:focus-visible, .fav:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pick { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.pick-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.pick-head .sel { font-weight: 700; font-size: 16px; }
.pick input { width: 100%; font: inherit; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); }
.champs { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 5px; max-height: 214px; overflow-y: auto; padding: 2px; }
.champ { font: inherit; font-size: 13px; text-align: left; padding: 7px 9px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; gap: 4px; min-width: 0; }
.champ span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.champ[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.mk-b { color: var(--buff); font-size: 11px; } .mk-n { color: var(--nerf); font-size: 11px; } .mk-r { color: var(--ut); font-size: 11px; }
.champ[aria-pressed="true"] .mk-b, .champ[aria-pressed="true"] .mk-n, .champ[aria-pressed="true"] .mk-r { color: inherit; }
.vs { font-family: var(--f-label); font-size: 14px; letter-spacing: .3em; color: var(--muted); text-align: center; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
.vs::before, .vs::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.note { color: var(--muted); font-size: 12.5px; margin: 0; }
.result { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.lane-tag { font-family: var(--f-label); font-size: 15px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
.vs-card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 18px; align-items: start; overflow: hidden; }
.vs-card::before { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, color-mix(in srgb, var(--accent) 9%, transparent) 0 46%, transparent 46% 54%, color-mix(in srgb, var(--ad) 8%, transparent) 54% 100%); pointer-events: none; }
.vs-mid { position: relative; align-self: center; font-family: var(--f-label); font-size: 30px; font-weight: 700; letter-spacing: .12em; color: var(--muted); }
@media (max-width: 720px) { .vs-card { grid-template-columns: minmax(0, 1fr); } .vs-mid { justify-self: center; } }
.cb { position: relative; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.cb-top { display: flex; align-items: center; gap: 14px; }
.who { font-family: var(--f-label); font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.cn { font-size: 22px; font-weight: 800; letter-spacing: -.01em; line-height: 1.15; }
.cr { color: var(--muted); font-size: 13px; }
.hex { display: inline-grid; place-items: center; width: 64px; height: 72px; flex: none; padding: 2px; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: currentColor; }
.hex > span { display: grid; place-items: center; width: 100%; height: 100%; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: color-mix(in srgb, currentColor 16%, var(--surface)); font-family: var(--f-label); font-size: 24px; font-weight: 700; letter-spacing: .02em; }
.hex.sm { width: 52px; height: 58px; } .hex.sm > span { font-size: 20px; }
.h-ad, .t-ad { color: var(--ad); } .h-ap, .t-ap { color: var(--ap); } .h-mx, .t-ut { color: var(--ut); } .t-df { color: var(--df); }
.hex > span { color: var(--fg); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; padding: 2px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface-2); }
.chip.ad { color: var(--ad); border-color: currentColor; background: transparent; font-weight: 600; }
.chip.ap { color: var(--ap); border-color: currentColor; background: transparent; font-weight: 600; }
.chip.mx { color: var(--ut); border-color: currentColor; background: transparent; font-weight: 600; }
.stats { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
.stats li { display: grid; grid-template-columns: 112px 1fr; align-items: center; gap: 10px; font-size: 12.5px; color: var(--muted); }
.pips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; max-width: 130px; }
.pips i { height: 6px; border-radius: 2px; background: var(--line); }
.pips i.on { background: var(--accent); }
.cb.foe .pips i.on { background: var(--gold); }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 6px 12px; }
.path { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; counter-reset: s; }
.step { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.step.counter { border-color: color-mix(in srgb, var(--gold) 55%, var(--line)); background: linear-gradient(180deg, color-mix(in srgb, var(--gold) 9%, var(--surface)), var(--surface) 60%); }
.s-top { display: flex; align-items: center; justify-content: space-between; }
.num { font-family: var(--f-label); font-size: 30px; font-weight: 700; color: var(--muted); line-height: 1; font-variant-numeric: tabular-nums; }
.s-name { font-weight: 700; font-size: 15px; line-height: 1.3; }
.s-badges { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge { font-family: var(--f-label); font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 1px 8px; border-radius: 3px; border: 1px solid var(--line); color: var(--muted); }
.badge.counter { background: var(--gold); border-color: var(--gold); color: var(--gold-fg); }
.itype { font-size: 11.5px; color: var(--muted); }
.step p { margin: 0; color: var(--muted); font-size: 13px; }
.step p.pn { color: var(--fg); border-top: 1px dashed var(--line); padding-top: 6px; }
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 680px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.box .big { font-weight: 700; font-size: 16px; }
.box p { margin: 0; color: var(--muted); font-size: 13px; }
ul.tips { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
ul.tips li { position: relative; padding: 10px 12px 10px 38px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
ul.tips li::before { content: ""; position: absolute; left: 14px; top: 17px; width: 10px; height: 10px; background: var(--accent); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
.patchbox { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--gold); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.up { color: var(--buff); font-weight: 700; } .down { color: var(--nerf); font-weight: 700; } .rw { color: var(--ut); font-weight: 700; }
.foot { color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 4px; }
@media (prefers-reduced-motion: no-preference) { .step, .box, .fav, .champ { transition: border-color .15s, transform .15s; } .step:hover { border-color: var(--accent); transform: translateY(-2px); } }

.top-r { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.langs { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.langs button { font-family: var(--f-label); font-size: 15px; font-weight: 700; letter-spacing: .12em; padding: 8px 14px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.langs button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.langs button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow" id="t-eyebrow"></p>
      <h1 id="t-h1"></h1>
      <p class="lead" id="t-lead"></p>
    </div>
    <div class="top-r">
      <div class="langs" role="group" aria-label="Ngôn ngữ / Language">
        <button type="button" data-lang="vi" title="Tiếng Việt" aria-pressed="true">VN</button>
        <button type="button" data-lang="en" title="English" aria-pressed="false">US</button>

    <section class="result" id="result" aria-live="polite"></section>

  <footer class="foot">
    <span id="t-f1"></span>
    <span id="t-f2"></span>
  </footer>
</div>

    if (has(e, "poke") && k === "AD" && !mk) add("Spirit Visage", L(n + " đánh rỉa liên tục. Spirit Visage tăng hồi máu và kháng phép.", n + " pokes constantly. Spirit Visage boosts healing and magic resist."), 5);

    var seen = {}, out = [];
    rules.sort(function (a, b) { return b.pri - a.pri; }).forEach(function (r) { if (!seen[r.item]) { seen[r.item] = 1; out.push(r); } });
    return out;
  }

  function boots(u, e) {
    var hard = has(e, "hardcc");
    if (e.d === "AP" || hard) return ["Mercury's Treads", e.d === "AP" ? L(e.n + " gây sát thương phép.", e.n + " deals magic damage.") : L(e.n + " có CC cứng.", e.n + " has hard CC."), L("Kháng phép và giảm thời gian bị khống chế.", "Magic resist and reduced crowd-control duration.")];
    if (e.d === "AD" && (has(e, "assassin") || has(e, "fighter") || has(e, "crit") || has(e, "onhit"))) return ["Plated Steelcaps", L(e.n + " gây sát thương bằng đánh thường.", e.n + " deals damage with basic attacks."), L("Giáp và giảm sát thương từ đòn đánh thường.", "Armor and reduced basic-attack damage.")];
    return [ARCH[u.a].boots, L("Không có mối đe dọa nào đòi đổi giày.", "No threat calls for a boots swap."), L("Dùng giày mặc định của kiểu tướng.", "Default boots for this champion type.")];
  }

  function tips(u, e) {
    var t = [], n = e.n;
    var squishy = (u.kind === "AP" || u.kind === "EN" || u.a === "mmc" || u.a === "mmo");
    if (has(e, "assassin") && squishy) t.push(L("Giữ kỹ năng thoát thân và Tốc biến cho " + n + ". Đặt mắt ở bụi cỏ hai bên và đứng gần lính hoặc đồng đội.", "Keep your escape and Flash up against " + n + ". Ward both brushes and stay near minions or allies."));
    if (has(e, "poke")) t.push(L(n + " đánh rỉa tầm xa. Đừng đứng yên trong tầm, trade khi chiêu của họ đang hồi.", n + " pokes from range. Don't stand still in range; trade when their spells are on cooldown."));
    if (has(e, "hardcc")) t.push(L("Chờ " + n + " dùng chiêu khống chế rồi mới giao tranh. Đứng sau lính để chặn chiêu bay.", "Wait for " + n + " to use crowd control before fighting. Stand behind minions to block skillshots."));
    if (has(e, "hyper")) t.push(L(n + " mạnh hơn về cuối. Ép nhịp bằng mục tiêu sớm thay vì kéo dài trận.", n + " scales better into late game. Press your tempo with early objectives instead of dragging the game out."));
    if (has(e, "splitter")) t.push(L(n + " thích đẩy đường 1 đấu 1. Cần ward cánh và đồng đội phản ứng nhanh.", n + " likes to split-push 1v1. You need wards on the flanks and allies who react fast."));
    if (has(e, "tank")) t.push(L("Đối thủ dày máu. Ưu tiên sát thương xuyên giáp, theo % máu hoặc kéo dài như Liandry's, Black Cleaver.", "The enemy has lots of health. Prefer penetration, percent-health or sustained damage such as Liandry's or Black Cleaver."));
    if (has(e, "heal")) t.push(L("Mua đồ cắt hồi máu sau khi " + n + " có món lõi đầu tiên, không nên mua quá muộn.", "Buy anti-heal after " + n + " gets the first core item; don't leave it too late."));
    if (has(e, "shield")) t.push(L(n + " có lá chắn. Đánh sau khi lá chắn vỡ thay vì xả chiêu ngay.", n + " has shields. Hit after the shield breaks instead of dumping spells right away."));
    if (has(e, "dash") && !has(e, "assassin")) t.push(L(n + " có kỹ năng lao. Giữ chiêu làm chậm hoặc khống chế để trả lời.", n + " has gap-closers. Save your slow or crowd control to answer."));
    if (!t.length) t.push(L("Không có điểm cần đổi lớn. Chơi theo kế hoạch đồ mặc định của " + u.n + " và theo dõi món đồ đầu tiên của " + n + ".", "No major changes needed. Follow " + u.n + "'s default plan and watch " + n + "'s first item."));
    return t.slice(0, 5);
  }

  function composeBuild(u, e) {
    var core = u.core.slice(), cnt = compute(u, e), slots = [];
    var picks = [];
    cnt.forEach(function (r) { if (picks.length < 3) picks.push(r); });
    slots.push({ item: core[0], kind: "core", reason: L("Món lõi của " + u.n + " (" + lbName(u.a) + ").", "Core item of " + u.n + " (" + lbName(u.a) + ").") });
    var urgent = picks.length && picks[0].pri >= 9 ? picks.shift() : null;
    function pushCounter(r) {
      if (slots.some(function (s) { return s.item === r.item; })) return;
      slots.push({ item: r.item, kind: "counter", reason: r.reason });
    }
    if (urgent) pushCounter(urgent);
    if (core[1] && !slots.some(function (s) { return s.item === core[1]; })) slots.push({ item: core[1], kind: "core", reason: L("Món lõi tiếp theo của " + u.n + ".", "Next core item of " + u.n + ".") });
    picks.forEach(pushCounter);
    core.slice(2).forEach(function (n) {
      if (slots.length < 5 && !slots.some(function (s) { return s.item === n; })) slots.push({ item: n, kind: "core", reason: L("Món hoàn thiện kiểu tướng.", "Finishing item for the champion type.") });
    });
    slots = slots.slice(0, 5);
    var removed = core.filter(function (n) { return !slots.some(function (s) { return s.item === n; }); });
    return { slots: slots, removed: removed };
  }

  var FAV_MAIN = [["Cho'Gath", "T"], ["Cho'Gath", "J"], ["Sylas", "M"], ["Sylas", "J"], ["Miss Fortune", "B"], ["Caitlyn", "B"]];
  var FAV_SIM = [["Mordekaiser", "T"], ["Maokai", "T"], ["Rumble", "T"], ["Gwen", "T"],
    ["LeBlanc", "M"], ["Akali", "M"], ["Katarina", "M"], ["Diana", "J"],
    ["Jhin", "B"], ["Ashe", "B"], ["Varus", "B"], ["Ezreal", "B"], ["Jinx", "B"]];

  function byId(id) { return document.getElementById(id); }

  function renderStatic() {
    document.documentElement.lang = lang;
    byId("t-eyebrow").textContent = L("Liên Minh Huyền Thoại · Mùa 2026", "League of Legends · 2026 Season");
    byId("t-h1").textContent = L("Build Khắc Chế", "Counter Build");
    byId("t-lead").textContent = L("Chọn đường, tướng của bạn và tướng đối thủ. Trang tính thứ tự lên đồ, giày, bảng ngọc và cách chơi khắc chế.", "Pick a lane, your champion and the enemy champion. The page works out item order, boots, runes and how to play the matchup.");
    byId("t-patch").innerHTML = L("<i></i>Patch <b>26.22</b> · live 04/11 · 26.23 dự kiến 18/11", "<i></i>Patch <b>26.22</b> · live Nov 4 · 26.23 expected Nov 18");
    byId("t-lane").textContent = L("Đường", "Lane");
    byId("t-vs").textContent = L("đấu với", "versus");
    byId("t-note").textContent = L("▲ buff, ▼ nerf, ◆ làm lại ở patch 26.22.", "▲ buff, ▼ nerf, ◆ reworked in patch 26.22.");
    byId("t-f1").textContent = L("Gợi ý được tính theo luật khắc chế (loại sát thương, khống chế, hồi máu, lá chắn, độ trâu của đối thủ). Đây không phải thống kê tỉ lệ thắng.", "Suggestions follow counter rules (damage type, crowd control, healing, shields and durability of the enemy). They are not win-rate statistics.");
    byId("t-f2").textContent = L("Chưa có Zaahen và Locke vì chưa xác minh được bộ chiêu. Đồ khởi đầu và phần thưởng nhiệm vụ vị trí đổi theo mùa nên cần đối chiếu cửa hàng trong game. Số liệu patch lấy từ ghi chú 26.22.", "Zaahen and Locke are missing because their kits are not verified. Starter items and role quest rewards change by season, so check the in-game shop. Patch figures come from the 26.22 notes.");
    Array.prototype.forEach.call(document.querySelectorAll(".langs button"), function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === lang));
    });
  }

  function renderFav() {
    var el = byId("favs");
    function chip(f, mine) {
      return '<button type="button" class="fav' + (mine ? " mine" : "") + '" data-n="' + esc(f[0]) + '" data-l="' + f[1] + '" aria-pressed="' + (state.me === f[0] && state.lane === f[1]) + '">' + esc(f[0]) + "<small>" + laneName(f[1]) + "</small></button>";
    }
    el.innerHTML = "<h3>" + L("Hay chơi", "Your picks") + '</h3><div class="favs">' + FAV_MAIN.map(function (f) { return chip(f, true); }).join("") +
      '</div><p class="fav-label">' + L("Cùng lối chơi", "Similar playstyle") + '</p><div class="favs">' + FAV_SIM.map(function (f) { return chip(f, false); }).join("") + "</div>";
    Array.prototype.forEach.call(el.querySelectorAll(".fav"), function (b) {
      b.addEventListener("click", function () {
        var n = b.getAttribute("data-n"), l = b.getAttribute("data-l");
        state.lane = l; state.me = n;
        var f = BY[state.foe];
        if (!f || f.l.indexOf(l) < 0 || f.n === n) state.foe = DEF[l][0] !== n ? DEF[l][0] : DEF[l][1];
        q.me = ""; q.foe = "";
        save(); renderAll();
      });
    });
  }

  function renderLanes() {
    var el = byId("lanes");
    el.innerHTML = Object.keys(LANES).map(function (k) {
      return '<button type="button" class="lane" data-l="' + k + '" aria-pressed="' + (state.lane === k) + '">' + laneName(k) + "</button>";
    }).join("");
    Array.prototype.forEach.call(el.querySelectorAll("button"), function (b) {
      b.addEventListener("click", function () {
        state.lane = b.getAttribute("data-l");
        state.me = DEF[state.lane][0]; state.foe = DEF[state.lane][1];
        q.me = ""; q.foe = "";
        save(); renderAll();
      });
    });
  }

  function renderPick(side) {
    var el = byId("pick-" + side);
    var list = laneList();
    var term = q[side].toLowerCase();
    var shown = list.filter(function (c) { return !term || c.n.toLowerCase().indexOf(term) > -1; });
    var cur = state[side];
    el.innerHTML =
      '<div class="pick-head"><h3>' + (side === "me" ? L("Tướng của bạn", "Your champion") : L("Tướng đối thủ", "Enemy champion")) + '</h3><span class="sel">' + esc(cur) + " " + mark(cur) + "</span></div>" +
      '<input type="search" id="q-' + side + '" placeholder="' + L("Tìm tướng", "Search champion") + '" autocomplete="off" value="' + esc(q[side]) + '">' +
      '<div class="champs">' + (shown.length ? shown.map(function (c) {
        return '<button type="button" class="champ" data-n="' + esc(c.n) + '" aria-pressed="' + (c.n === cur) + '"><span>' + esc(c.n) + "</span>" + mark(c.n) + "</button>";
      }).join("") : '<span class="note">' + L("Không có tướng khớp ở đường này.", "No champion matches in this lane.") + "</span>") + "</div>";
    var inp = el.querySelector("input");
    inp.addEventListener("input", function () {
      q[side] = inp.value;
      var pos = inp.selectionStart;
      renderPick(side);
      var ni = byId("q-" + side); ni.focus(); try { ni.setSelectionRange(pos, pos); } catch (e) {}
    });
    Array.prototype.forEach.call(el.querySelectorAll(".champ"), function (b) {
      b.addEventListener("click", function () {
        state[side] = b.getAttribute("data-n");
        save(); renderPick(side); renderResult(); renderFav();
      });
    });
  }

  function statNames() { return L(["Sát thương", "Khống chế", "Hồi phục / khiên", "Cơ động", "Tầm đánh", "Độ trâu"], ["Damage", "Crowd control", "Sustain / shields", "Mobility", "Range", "Durability"]); }
  function stats(c) {
    var t = c.t, a = c.a;
    var dmg = (t.assassin || t.burstAP || t.burstAD || a === "mmc" || a === "mmo") ? 3 : (a === "apd" || a === "brs" || a === "spl" || a === "apb" || a === "ona" || a === "jug") ? 2 : 1;
    var cc = t.hardcc ? 3 : (t.cc ? 2 : 0);
    var sus = (t.heal && t.shield) ? 3 : (t.heal || t.shield) ? 2 : 0;
    var mob = t.dash ? 3 : ((t.assassin || t.fighter) ? 2 : 1);
    var rng = (t.ranged && !t.melee) ? 3 : 1;
    var tank = (t.tank || a === "jug") ? 3 : (t.fighter ? 2 : 1);
    return [dmg, cc, sus, mob, rng, tank];
  }
  function pips(n) { return '<span class="pips">' + [1, 2, 3].map(function (i) { return '<i class="' + (i <= n ? "on" : "") + '"></i>'; }).join("") + "</span>"; }

  function champBlock(c, who) {
    var dm = { AD: ["ad", L("Sát thương vật lý", "Physical damage")], AP: ["ap", L("Sát thương phép", "Magic damage")], MX: ["mx", L("Sát thương hỗn hợp", "Mixed damage")] }[c.d];
    var chips = '<span class="chip ' + dm[0] + '">' + dm[1] + "</span>" +
      Object.keys(c.t).filter(function (t) { return TAGVN[t] && t !== "support" && t !== "ranged"; }).map(function (t) { return '<span class="chip">' + tagName(t) + "</span>"; }).join("");
    var st = stats(c), names = statNames();
    var rows = names.map(function (n, i) { return "<li><span>" + n + "</span>" + pips(st[i]) + "</li>"; }).join("");
    return '<div class="cb ' + who + '"><div class="cb-top"><span class="hex h-' + dm[0] + '"><span>' + esc(ab(c.n)) + '</span></span><div><div class="who">' + (who === "me" ? L("Bạn", "You") : L("Đối thủ", "Enemy")) + '</div><div class="cn">' + esc(c.n) + " " + mark(c.n) + '</div><div class="cr">' + lbName(c.a) + '</div></div></div><div class="chips">' + chips + '</div><ul class="stats">' + rows + "</ul></div>";
  }

  function renderResult() {
    var u = BY[state.me], e = BY[state.foe];
    var el = byId("result");
    if (!u || !e) { el.innerHTML = ""; return; }
    var b = composeBuild(u, e), bt = boots(u, e);
    var ITN = { ad: L("Sát thương vật lý", "Physical damage"), ap: L("Sức mạnh phép", "Magic power"), df: L("Phòng thủ", "Defense"), ut: L("Hỗ trợ", "Support") };

    var items = b.slots.map(function (s, i) {
      var ty = ITYPE[s.item] || "df";
      var ip = itemPatch(s.item);
      var pn = ip ? '<p class="pn">' + esc(ip) + "</p>" : "";
      return '<li class="step ' + (s.kind === "counter" ? "counter" : "") + '"><div class="s-top"><span class="num">' + (i + 1) + '</span><span class="hex sm t-' + ty + '"><span>' + esc(ab(s.item)) + '</span></span></div><div class="s-name">' + esc(s.item) +
        '</div><div class="s-badges"><span class="badge ' + (s.kind === "counter" ? "counter" : "") + '">' + (s.kind === "counter" ? L("Khắc chế", "Counter") : L("Lõi", "Core")) + '</span><span class="itype">' + ITN[ty] + "</span></div><p>" + esc(s.reason) + "</p>" + pn + "</li>";
    }).join("");

    var pm = [];
    [u, e].forEach(function (c) {
      var p = PATCH[c.n];
      if (p) pm.push('<div><span class="' + (p[0] === "up" ? "up" : p[0] === "down" ? "down" : "rw") + '">' + esc(c.n) + " " + (p[0] === "up" ? "▲ buff" : p[0] === "down" ? "▼ nerf" : L("◆ làm lại", "◆ reworked")) + "</span> " + esc(patchText(c.n)) + "</div>");
    });
    if (e.n === "Mel") pm.push("<div>" + L("Hệ quả khi đánh với Mel: chiêu bay của bạn không còn bị phản lại nữa kể từ 26.22.", "Against Mel: your projectiles are no longer reflected since 26.22.") + "</div>");
    var patchHtml = pm.length ? '<div class="sec"><h3>' + L("Patch 26.22 liên quan", "Related patch 26.22 notes") + '</h3><div class="patchbox">' + pm.join("") + "</div></div>" : "";

    var rtips = tips(u, e).map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("");
    var rm = b.removed.length ? '<p class="note">' + L("Món lõi mặc định nhường chỗ cho đồ khắc chế: ", "Default core items made room for counter items: ") + b.removed.map(esc).join(", ") + L(". Mua lại nếu trận đã thắng thế.", ". Buy them back if you are ahead.") + "</p>" : "";

    var runeTip = [];
    if (has(e, "poke")) runeTip.push(L("Cây phụ nên cân nhắc Second Wind nếu bảng rune hiện tại còn có.", "Consider Second Wind in the secondary tree if the current rune page has it."));
    if (has(e, "assassin") && u.kind !== "TK") runeTip.push(L("Cân nhắc rune phòng thủ ở cây phụ để sống qua đợt burst đầu.", "Consider a defensive secondary rune to survive the first burst."));

    el.innerHTML =
      '<div class="sec"><span class="lane-tag">' + laneFull(state.lane) + '</span><div class="vs-card">' + champBlock(u, "me") + '<div class="vs-mid">VS</div>' + champBlock(e, "foe") + "</div>" +
      '<p class="note">' + L("Thang đo chỉ là ước lượng từ đặc điểm của tướng, không phải số liệu trận đấu.", "Bars are estimates from champion traits, not match data.") + "</p></div>" +
      '<div class="sec"><div class="sec-head"><h3>' + L("Đường lên đồ", "Build path") + '</h3></div><ol class="path">' + items + "</ol>" + rm + "</div>" +
      '<div class="cols">' +
      '<div class="box"><h3>' + L("Giày", "Boots") + '</h3><div class="big">' + esc(bt[0]) + "</div><p>" + esc(bt[1]) + " " + esc(bt[2]) + "</p></div>" +
      '<div class="box"><h3>' + L("Bảng ngọc", "Runes") + '</h3><div class="big">' + esc(enx(ARCH[u.a].rune)) + "</div><p>" + esc(enx(ARCH[u.a].tree)) + (runeTip.length ? ". " + esc(runeTip.join(" ")) : "") + "</p></div>" +
      "</div>" +
      '<div class="sec"><h3>' + L("Cách chơi khắc chế", "How to play the matchup") + '</h3><ul class="tips">' + rtips + "</ul></div>" + patchHtml;
  }

  function renderAll() { renderStatic(); renderFav(); renderLanes(); renderPick("me"); renderPick("foe"); renderResult(); }

  Array.prototype.forEach.call(document.querySelectorAll(".langs button"), function (b) {
    b.addEventListener("click", function () {
      lang = b.getAttribute("data-lang");
      try { localStorage.setItem("lmht-lang", lang); } catch (e) {}
      renderAll();
    });
  });
  renderAll();
})();
</script>

</body>
